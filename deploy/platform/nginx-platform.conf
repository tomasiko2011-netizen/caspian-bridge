# Khazar Bridge — платформа (Next.js за nginx). VPS hoster.kz.
# /etc/nginx/sites-available/khazarbridge → ln -s в sites-enabled → nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d khazarbridge.kz -d www.khazarbridge.kz -d khazarbridge.com -d www.khazarbridge.com

upstream khazarbridge_app { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name khazarbridge.kz www.khazarbridge.kz khazarbridge.com www.khazarbridge.com;

  client_max_body_size 25m;          # загрузка фото товаров и сканов документов
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # ── Лента уведомлений (SSE). Буферизацию обязательно выключить,
  #    иначе nginx копит поток и уведомления не доходят до браузера.
  location /api/notifications/stream {
    proxy_pass http://khazarbridge_app;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 1h;           # соединение держим долго, клиент сам переподключается
  }

  # ── Статика Next.js
  location /_next/static/ {
    proxy_pass http://khazarbridge_app;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://khazarbridge_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
