# /etc/nginx/sites-available/khazarbridge  →  ln -s в sites-enabled, затем: nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d khazarbridge.kz -d www.khazarbridge.kz -d khazarbridge.com -d www.khazarbridge.com
server {
  listen 80;
  listen [::]:80;
  server_name khazarbridge.kz www.khazarbridge.kz khazarbridge.com www.khazarbridge.com;
  root /var/www/khazarbridge;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  location ~* \.(jpg|jpeg|png|webp|svg)$ { expires 30d; add_header Cache-Control "public"; }
  location ~* \.(css|js)$ { expires 1d; }
  location / { try_files $uri $uri/ =404; }
}
